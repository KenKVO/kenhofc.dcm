<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="white"/>

<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 650; }
  .small { font-size: 16px; }
  .tiny { font-size: 14px; }
  .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 18; }
  .soft { fill: #f3f3f3; stroke: #111; stroke-width: 2; rx: 18; }
  .light { fill: #fafafa; stroke: #777; stroke-width: 1.5; rx: 14; }
  .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #777; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
  </marker>
</defs>

<text x="60" y="60" class="title">A factorial VIT is a parameter space, not a pile of images</text>

<text x="150" y="145" class="label">Dose</text>
<text x="90" y="260" class="small">low</text>
<text x="72" y="390" class="small">medium</text>
<text x="60" y="520" class="small">reference</text>

<text x="405" y="145" text-anchor="middle" class="label">smooth</text>
<text x="610" y="145" text-anchor="middle" class="label">medium</text>
<text x="815" y="145" text-anchor="middle" class="label">sharp</text>
<text x="610" y="105" text-anchor="middle" class="small">reconstruction kernel</text>

<!-- grid -->
<g>
  <rect x="315" y="190" width="180" height="105" class="light"/>
  <rect x="520" y="190" width="180" height="105" class="light"/>
  <rect x="725" y="190" width="180" height="105" class="light"/>
  <rect x="315" y="320" width="180" height="105" class="light"/>
  <rect x="520" y="320" width="180" height="105" class="soft"/>
  <rect x="725" y="320" width="180" height="105" class="light"/>
  <rect x="315" y="450" width="180" height="105" class="light"/>
  <rect x="520" y="450" width="180" height="105" class="light"/>
  <rect x="725" y="450" width="180" height="105" class="light"/>
</g>

<!-- stylized nodules/noise -->
<g fill="none" stroke="#111">
  <circle cx="405" cy="242" r="20" stroke-width="3"/>
  <circle cx="610" cy="242" r="20" stroke-width="3"/>
  <circle cx="815" cy="242" r="20" stroke-width="3"/>
  <circle cx="405" cy="372" r="20" stroke-width="3"/>
  <circle cx="610" cy="372" r="20" stroke-width="3"/>
  <circle cx="815" cy="372" r="20" stroke-width="3"/>
  <circle cx="405" cy="502" r="20" stroke-width="3"/>
  <circle cx="610" cy="502" r="20" stroke-width="3"/>
  <circle cx="815" cy="502" r="20" stroke-width="3"/>
</g>

<g fill="#777">
  <circle cx="350" cy="220" r="2"/><circle cx="430" cy="270" r="2"/><circle cx="470" cy="225" r="2"/>
  <circle cx="555" cy="220" r="2"/><circle cx="640" cy="270" r="2"/><circle cx="675" cy="225" r="2"/>
  <circle cx="760" cy="220" r="2"/><circle cx="845" cy="270" r="2"/><circle cx="880" cy="225" r="2"/>
  <circle cx="350" cy="350" r="1.8"/><circle cx="460" cy="395" r="1.8"/>
  <circle cx="555" cy="350" r="1.8"/><circle cx="665" cy="395" r="1.8"/>
  <circle cx="760" cy="350" r="1.8"/><circle cx="870" cy="395" r="1.8"/>
  <circle cx="350" cy="485" r="1.4"/><circle cx="460" cy="525" r="1.4"/>
  <circle cx="555" cy="485" r="1.4"/><circle cx="665" cy="525" r="1.4"/>
  <circle cx="760" cy="485" r="1.4"/><circle cx="870" cy="525" r="1.4"/>
</g>

<rect x="960" y="190" width="180" height="365" class="soft"/>
<text x="1050" y="230" text-anchor="middle" class="label">For every cell</text>
<text x="1050" y="275" text-anchor="middle" class="small">same cohort</text>
<text x="1050" y="310" text-anchor="middle" class="small">+ repeat seeds</text>
<text x="1050" y="345" text-anchor="middle" class="small">+ same endpoint</text>
<line x1="990" y1="375" x2="1110" y2="375" stroke="#777"/>
<text x="1050" y="415" text-anchor="middle" class="small">then test:</text>
<text x="1050" y="450" text-anchor="middle" class="small">main effects</text>
<text x="1050" y="485" text-anchor="middle" class="small">interactions</text>
<text x="1050" y="520" text-anchor="middle" class="small">tradeoffs</text>

<rect x="315" y="620" width="590" height="72" class="box"/>
<text x="610" y="651" text-anchor="middle" class="label">Third dimension: slice thickness</text>
<text x="610" y="678" text-anchor="middle" class="small">repeat the grid for thin • standard • thick</text>

<text x="610" y="730" text-anchor="middle" class="small">the goal is to estimate effects, not to maximize the number of simulated conditions</text>
</svg>