<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="white"/>

<style>
  text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111; }
  .title { font-size: 28px; font-weight: 700; }
  .label { font-size: 20px; font-weight: 650; }
  .small { font-size: 16px; }
  .tiny { font-size: 14px; }
  .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 18; }
  .soft { fill: #f3f3f3; stroke: #111; stroke-width: 2; rx: 18; }
  .light { fill: #fafafa; stroke: #777; stroke-width: 1.5; rx: 14; }
  .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #777; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
  </marker>
</defs>

<text x="60" y="60" class="title">Counterfactual pairing: one anatomy, several scans</text>

<rect x="60" y="235" width="200" height="140" class="soft"/>
<text x="160" y="280" text-anchor="middle" class="label">Virtual patient j</text>
<text x="160" y="312" text-anchor="middle" class="small">same anatomy</text>
<text x="160" y="338" text-anchor="middle" class="small">same pathology</text>
<text x="160" y="364" text-anchor="middle" class="small">same ground truth</text>

<rect x="390" y="105" width="180" height="90" class="box"/>
<text x="480" y="145" text-anchor="middle" class="label">Protocol A</text>
<text x="480" y="175" text-anchor="middle" class="small">reference</text>

<rect x="390" y="260" width="180" height="90" class="box"/>
<text x="480" y="300" text-anchor="middle" class="label">Protocol B</text>
<text x="480" y="330" text-anchor="middle" class="small">change one factor</text>

<rect x="390" y="415" width="180" height="90" class="box"/>
<text x="480" y="455" text-anchor="middle" class="label">Protocol C</text>
<text x="480" y="485" text-anchor="middle" class="small">another condition</text>

<path d="M260 305 C320 305 320 150 390 150" class="arrow"/>
<path d="M260 305 L390 305" class="arrow"/>
<path d="M260 305 C320 305 320 460 390 460" class="arrow"/>

<rect x="700" y="105" width="180" height="90" class="light"/>
<text x="790" y="145" text-anchor="middle" class="label">Image A</text>
<text x="790" y="175" text-anchor="middle" class="small">Y(j,A)</text>

<rect x="700" y="260" width="180" height="90" class="light"/>
<text x="790" y="300" text-anchor="middle" class="label">Image B</text>
<text x="790" y="330" text-anchor="middle" class="small">Y(j,B)</text>

<rect x="700" y="415" width="180" height="90" class="light"/>
<text x="790" y="455" text-anchor="middle" class="label">Image C</text>
<text x="790" y="485" text-anchor="middle" class="small">Y(j,C)</text>

<path d="M570 150 L700 150" class="arrow"/>
<path d="M570 305 L700 305" class="arrow"/>
<path d="M570 460 L700 460" class="arrow"/>

<rect x="970" y="225" width="180" height="160" class="soft"/>
<text x="1060" y="265" text-anchor="middle" class="label">Paired effects</text>
<text x="1060" y="310" text-anchor="middle" class="small">ΔBA = YB − YA</text>
<text x="1060" y="345" text-anchor="middle" class="small">ΔCA = YC − YA</text>

<path d="M880 150 C940 150 940 265 970 265" class="arrow"/>
<path d="M880 305 L970 305" class="arrow"/>
<path d="M880 460 C940 460 940 345 970 345" class="arrow"/>

<text x="600" y="590" text-anchor="middle" class="small">anatomical variability becomes a blocked factor instead of a confounder</text>
</svg>