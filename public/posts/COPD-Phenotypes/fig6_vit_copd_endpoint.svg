<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">A COPD VIT separates biology from measurement bias</text><rect x="60" y="180" width="230" height="150" class="soft"/><text x="175" y="220" text-anchor="middle" class="label">Fixed COPD truth</text><text x="175" y="254" text-anchor="middle" class="small">emphysema fraction</text><text x="175" y="280" text-anchor="middle" class="small">airway WT / WA%</text><text x="175" y="306" text-anchor="middle" class="small">mucus objects</text><rect x="400" y="105" width="220" height="110" class="box"/><text x="510" y="145" text-anchor="middle" class="label">Protocol A</text><text x="510" y="175" text-anchor="middle" class="small">dose • resolution • kernel</text><rect x="400" y="300" width="220" height="110" class="box"/><text x="510" y="340" text-anchor="middle" class="label">Protocol B</text><text x="510" y="370" text-anchor="middle" class="small">change imaging only</text><path d="M290 255 C345 255 345 160 400 160" class="arrow"/><path d="M290 255 C345 255 345 355 400 355" class="arrow"/><rect x="735" y="105" width="230" height="110" class="light"/><text x="850" y="145" text-anchor="middle" class="label">Measured A</text><text x="850" y="175" text-anchor="middle" class="small">LAA • WT • mucus score</text><rect x="735" y="300" width="230" height="110" class="light"/><text x="850" y="340" text-anchor="middle" class="label">Measured B</text><text x="850" y="370" text-anchor="middle" class="small">same biomarkers</text><path d="M620 160 L735 160" class="arrow"/><path d="M620 355 L735 355" class="arrow"/><rect x="1030" y="185" width="130" height="145" class="soft"/><text x="1095" y="220" text-anchor="middle" class="label">Error</text><text x="1095" y="258" text-anchor="middle" class="small">M − GT</text><text x="1095" y="292" text-anchor="middle" class="small">bias</text><text x="1095" y="315" text-anchor="middle" class="small">variance</text><path d="M965 160 C1000 160 1000 220 1030 220" class="arrow"/><path d="M965 355 C1000 355 1000 290 1030 290" class="arrow"/><rect x="225" y="500" width="750" height="80" class="box"/><text x="600" y="533" text-anchor="middle" class="label">Scientific question</text><text x="600" y="560" text-anchor="middle" class="small">Which imaging condition best preserves the COPD biomarker relative to known truth?</text></svg>