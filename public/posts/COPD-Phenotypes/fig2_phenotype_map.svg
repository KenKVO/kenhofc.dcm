<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">COPD phenotypes overlap</text><circle cx="370" cy="290" r="150" fill="#f3f3f3" stroke="#111" stroke-width="2"/><circle cx="580" cy="290" r="150" fill="#fafafa" stroke="#111" stroke-width="2"/><circle cx="475" cy="430" r="150" fill="#f7f7f7" stroke="#111" stroke-width="2"/><text x="315" y="220" text-anchor="middle" class="label">Emphysema</text><text x="635" y="220" text-anchor="middle" class="label">Airway disease</text><text x="475" y="500" text-anchor="middle" class="label">Small-airway disease</text><rect x="795" y="125" width="320" height="74" class="soft"/><text x="955" y="157" text-anchor="middle" class="label">Chronic bronchitis</text><text x="955" y="182" text-anchor="middle" class="small">clinical cough + sputum phenotype</text><rect x="795" y="225" width="320" height="74" class="soft"/><text x="955" y="257" text-anchor="middle" class="label">Mucus plugging</text><text x="955" y="282" text-anchor="middle" class="small">CT-visible airway occlusion</text><rect x="795" y="325" width="320" height="74" class="soft"/><text x="955" y="357" text-anchor="middle" class="label">Frequent exacerbations</text><text x="955" y="382" text-anchor="middle" class="small">clinical-event phenotype</text><rect x="795" y="425" width="320" height="74" class="soft"/><text x="955" y="457" text-anchor="middle" class="label">Pulmonary vascular</text><text x="955" y="482" text-anchor="middle" class="small">vascular remodeling / PH risk</text><path d="M680 270 C735 250 745 175 795 162" class="dash"/><path d="M680 310 C735 310 745 262 795 262" class="dash"/><path d="M635 405 C725 420 745 362 795 362" class="dash"/><path d="M555 530 C690 570 730 480 795 462" class="dash"/><text x="55" y="630" class="small">One patient can occupy several regions at the same time; phenotype is not a mutually exclusive label.</text></svg>