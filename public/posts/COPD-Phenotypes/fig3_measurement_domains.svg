<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">Five measurement domains answer five different questions</text><rect x="55" y="145" width="205" height="120" class="soft"/><text x="157" y="183" text-anchor="middle" class="label">Structure</text><text x="157" y="215" text-anchor="middle" class="small">CT emphysema</text><text x="157" y="238" text-anchor="middle" class="small">airway walls • mucus</text><rect x="285" y="145" width="205" height="120" class="box"/><text x="387" y="183" text-anchor="middle" class="label">Physiology</text><text x="387" y="215" text-anchor="middle" class="small">FEV₁ • RV/TLC</text><text x="387" y="238" text-anchor="middle" class="small">DLCO • oxygenation</text><rect x="515" y="145" width="205" height="120" class="soft"/><text x="617" y="183" text-anchor="middle" class="label">Symptoms</text><text x="617" y="215" text-anchor="middle" class="small">mMRC • CAAT</text><text x="617" y="238" text-anchor="middle" class="small">cough • sputum</text><rect x="745" y="145" width="205" height="120" class="box"/><text x="847" y="183" text-anchor="middle" class="label">Function</text><text x="847" y="215" text-anchor="middle" class="small">6MWD • CPET</text><text x="847" y="238" text-anchor="middle" class="small">daily activity</text><rect x="975" y="145" width="170" height="120" class="soft"/><text x="1060" y="183" text-anchor="middle" class="label">Events</text><text x="1060" y="215" text-anchor="middle" class="small">exacerbations</text><text x="1060" y="238" text-anchor="middle" class="small">hospitalization</text><text x="55" y="355" class="label">Example: emphysema-predominant disease</text><text x="55" y="400" class="small">CT: LAA-950 ↑ / Perc15 more negative</text><text x="55" y="435" class="small">Physiology: DLCO often ↓; hyperinflation may ↑</text><text x="55" y="470" class="small">Symptoms: exertional dyspnea may ↑</text><text x="55" y="505" class="small">Function: 6MWD may ↓</text><text x="55" y="540" class="small">Outcome: risk depends on much more than CT density alone</text><path d="M260 205 L285 205" class="arrow"/><path d="M490 205 L515 205" class="arrow"/><path d="M720 205 L745 205" class="arrow"/><path d="M950 205 L975 205" class="arrow"/><text x="800" y="430" text-anchor="middle" class="label">Association ≠ substitution</text><rect x="700" y="460" width="360" height="90" class="light"/><text x="880" y="496" text-anchor="middle" class="small">A biomarker can correlate with an outcome</text><text x="880" y="523" text-anchor="middle" class="small">without being a validated surrogate endpoint.</text></svg>