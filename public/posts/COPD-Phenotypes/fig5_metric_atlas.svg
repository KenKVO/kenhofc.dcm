<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">COPD metric atlas</text><rect x="60" y="120" width="330" height="150" class="soft"/><text x="90" y="158" class="label">Structure — CT</text><text x="90" y="192" class="small">LAA-950 • Perc15 • visual emphysema</text><text x="90" y="220" class="small">WT • WA% • Pi10 • lumen area</text><text x="90" y="248" class="small">mucus plugs • PA:A</text><rect x="435" y="120" width="330" height="150" class="box"/><text x="465" y="158" class="label">Physiology — PFT</text><text x="465" y="192" class="small">FEV₁ • FEV₁/FVC • FVC</text><text x="465" y="220" class="small">RV • TLC • RV/TLC • IC</text><text x="465" y="248" class="small">DLCO • oscillometry</text><rect x="810" y="120" width="330" height="150" class="soft"/><text x="840" y="158" class="label">Symptoms — PRO</text><text x="840" y="192" class="small">mMRC • CAAT/CAT • SGRQ</text><text x="840" y="220" class="small">cough • sputum • fatigue</text><text x="840" y="248" class="small">sleep • activity limitation</text><rect x="60" y="325" width="330" height="150" class="box"/><text x="90" y="363" class="label">Small airways</text><text x="90" y="397" class="small">expiratory LAA-856</text><text x="90" y="425" class="small">E/I density ratio • PRM-fSAD</text><text x="90" y="453" class="small">air trapping • ventilation heterogeneity</text><rect x="435" y="325" width="330" height="150" class="soft"/><text x="465" y="363" class="label">Function</text><text x="465" y="397" class="small">6MWD • nadir SpO₂</text><text x="465" y="425" class="small">Borg dyspnea • CPET</text><text x="465" y="453" class="small">VO₂ peak • physical activity</text><rect x="810" y="325" width="330" height="150" class="box"/><text x="840" y="363" class="label">Events + prognosis</text><text x="840" y="397" class="small">exacerbations/year</text><text x="840" y="425" class="small">hospitalizations • time-to-event</text><text x="840" y="453" class="small">BODE • mortality</text><rect x="205" y="545" width="790" height="92" class="light"/><text x="600" y="580" text-anchor="middle" class="label">Choose the domain that matches the hypothesis</text><text x="600" y="611" text-anchor="middle" class="small">More metrics do not rescue a poorly defined endpoint.</text></svg>