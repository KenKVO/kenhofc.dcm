<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">COPD is a chain of related—but different—domains</text><rect x="55" y="160" width="165" height="105" class="soft"/><text x="137" y="200" text-anchor="middle" class="label">Etiotype</text><text x="137" y="230" text-anchor="middle" class="small">smoke • genes</text><text x="137" y="252" text-anchor="middle" class="small">pollution • infection</text><rect x="250" y="160" width="165" height="105" class="box"/><text x="332" y="200" text-anchor="middle" class="label">Pathology</text><text x="332" y="230" text-anchor="middle" class="small">airway remodeling</text><text x="332" y="252" text-anchor="middle" class="small">tissue destruction</text><rect x="445" y="160" width="165" height="105" class="soft"/><text x="527" y="200" text-anchor="middle" class="label">Phenotype</text><text x="527" y="230" text-anchor="middle" class="small">emphysema</text><text x="527" y="252" text-anchor="middle" class="small">airway • mucus • SAD</text><rect x="640" y="160" width="165" height="105" class="box"/><text x="722" y="200" text-anchor="middle" class="label">Physiology</text><text x="722" y="230" text-anchor="middle" class="small">obstruction</text><text x="722" y="252" text-anchor="middle" class="small">gas trapping • DLCO</text><rect x="835" y="160" width="165" height="105" class="soft"/><text x="917" y="200" text-anchor="middle" class="label">Symptoms</text><text x="917" y="230" text-anchor="middle" class="small">dyspnea • cough</text><text x="917" y="252" text-anchor="middle" class="small">exercise limitation</text><rect x="1030" y="160" width="120" height="105" class="box"/><text x="1090" y="200" text-anchor="middle" class="label">Outcomes</text><text x="1090" y="230" text-anchor="middle" class="small">events</text><text x="1090" y="252" text-anchor="middle" class="small">survival</text><path d="M220 212 L250 212" class="arrow"/><path d="M415 212 L445 212" class="arrow"/><path d="M610 212 L640 212" class="arrow"/><path d="M805 212 L835 212" class="arrow"/><path d="M1000 212 L1030 212" class="arrow"/><text x="55" y="350" class="label">Different tests observe different layers</text><rect x="70" y="390" width="190" height="82" class="light"/><text x="165" y="423" text-anchor="middle" class="label">CT</text><text x="165" y="451" text-anchor="middle" class="small">structure + density</text><rect x="300" y="390" width="190" height="82" class="light"/><text x="395" y="423" text-anchor="middle" class="label">PFT</text><text x="395" y="451" text-anchor="middle" class="small">airflow + volumes</text><rect x="530" y="390" width="190" height="82" class="light"/><text x="625" y="423" text-anchor="middle" class="label">DLCO / SpO₂</text><text x="625" y="451" text-anchor="middle" class="small">gas exchange</text><rect x="760" y="390" width="190" height="82" class="light"/><text x="855" y="423" text-anchor="middle" class="label">6MWT</text><text x="855" y="451" text-anchor="middle" class="small">functional capacity</text><rect x="990" y="390" width="160" height="82" class="light"/><text x="1070" y="423" text-anchor="middle" class="label">CAAT / mMRC</text><text x="1070" y="451" text-anchor="middle" class="small">patient impact</text><text x="600" y="550" text-anchor="middle" class="small">A correlation across layers does not make two measurements interchangeable.</text></svg>