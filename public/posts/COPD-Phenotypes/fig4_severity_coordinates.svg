<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="white"/><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2;rx:16}.soft{fill:#f2f2f2;stroke:#111;stroke-width:2;rx:16}.light{fill:#fafafa;stroke:#777;stroke-width:1.5;rx:14}.arrow{stroke:#111;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#777;stroke-width:1.8;fill:none;stroke-dasharray:7 7}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><text x="55" y="58" class="title">COPD severity is a coordinate system, not a ruler</text><rect x="70" y="130" width="300" height="450" class="soft"/><text x="220" y="170" text-anchor="middle" class="label">Airflow obstruction</text><text x="220" y="205" text-anchor="middle" class="small">post-BD FEV₁ % predicted</text><line x1="120" y1="245" x2="320" y2="245" stroke="#111" stroke-width="2"/><text x="125" y="285" class="label">GOLD 1</text><text x="300" y="285" text-anchor="end" class="small">≥80%</text><text x="125" y="355" class="label">GOLD 2</text><text x="300" y="355" text-anchor="end" class="small">50–79%</text><text x="125" y="425" class="label">GOLD 3</text><text x="300" y="425" text-anchor="end" class="small">30–49%</text><text x="125" y="495" class="label">GOLD 4</text><text x="300" y="495" text-anchor="end" class="small">&lt;30%</text><rect x="450" y="130" width="300" height="450" class="box"/><text x="600" y="170" text-anchor="middle" class="label">Symptoms + events</text><text x="600" y="205" text-anchor="middle" class="small">GOLD A / B / E framework</text><rect x="500" y="250" width="200" height="72" class="light"/><text x="600" y="280" text-anchor="middle" class="label">A</text><text x="600" y="305" text-anchor="middle" class="small">lower symptom burden</text><rect x="500" y="350" width="200" height="72" class="light"/><text x="600" y="380" text-anchor="middle" class="label">B</text><text x="600" y="405" text-anchor="middle" class="small">greater symptoms</text><rect x="500" y="450" width="200" height="72" class="soft"/><text x="600" y="480" text-anchor="middle" class="label">E</text><text x="600" y="505" text-anchor="middle" class="small">≥1 moderate/severe event</text><rect x="830" y="130" width="300" height="450" class="soft"/><text x="980" y="170" text-anchor="middle" class="label">Additional coordinates</text><text x="875" y="245" class="small">CT structural burden</text><text x="875" y="295" class="small">RV/TLC hyperinflation</text><text x="875" y="345" class="small">DLCO gas transfer</text><text x="875" y="395" class="small">6MWD exercise capacity</text><text x="875" y="445" class="small">oxygenation</text><text x="875" y="495" class="small">BMI / comorbidity</text><text x="875" y="545" class="small">BODE / prognosis</text><text x="600" y="630" text-anchor="middle" class="small">Two patients can share one coordinate and differ strongly on the others.</text></svg>